name: refresh
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  refresh:
    concurrency: {group: refresh, cancel-in-progress: false}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore rolling files from the live site (markets, aircraft, naval reports, encrypted push state)
        run: |
          for f in markets.json aircraft.json naval.json push.bin; do curl -sfL --max-time 20 "https://wajeehk.github.io/frontline/data/$f?t=$(date +%s)" -o data/$f || rm -f data/$f; done
      - name: Fetch public sources and rebuild events (rules only, no AI)
        run: python3 scripts/fetch.py
      - name: Markets and live military aircraft
        run: python3 scripts/extras.py
        continue-on-error: true
      - name: Send Web Push alerts
        env: {VAPID_PRIVATE: '${{ secrets.VAPID_PRIVATE }}', PUSH_RSA_PRIV: '${{ secrets.PUSH_RSA_PRIV }}'}
        run: python3 -m venv /tmp/pv && /tmp/pv/bin/pip install -q 'pywebpush==2.*' && /tmp/pv/bin/python scripts/push.py
        continue-on-error: true
      - name: Commit event history when it changed
        run: |
          git config user.name "frontline-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet -- 'data/*-*.json'; then
            echo "No new events; deploying fresh files only"
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase -X theirs origin main || true
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
  # Self-scheduling chain (GitHub's cron is often late or skipped): ~13 min after each run, dispatch the next one
  # unless a newer run already exists, so parallel triggers converge to a single chain.
  chain:
    needs: refresh
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {actions: write}
    steps:
      - run: sleep 780
      - name: Dispatch next refresh unless a newer run exists
        env: {GH_TOKEN: '${{ github.token }}', R: '${{ github.repository }}', ID: '${{ github.run_id }}'}
        run: |
          me=$(gh api repos/$R/actions/runs/$ID -q .created_at)
          newer=$(gh api "repos/$R/actions/workflows/refresh.yml/runs?per_page=10" -q "[.workflow_runs[]|select(.id!=$ID and .created_at>\"$me\")]|length")
          if [ "$newer" = "0" ]; then gh workflow run refresh.yml -R $R --ref main && echo dispatched; else echo "newer run exists ($newer)"; fi
