name: refresh
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public sources and rebuild data (rules only, no AI)
        run: python3 scripts/fetch.py
      - name: Commit data when the event history changed
        run: |
          git config user.name "frontline-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet -- 'data/*-*.json'; then
            echo "No new events; deploying fresh index only"
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase -X theirs origin main || true
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
